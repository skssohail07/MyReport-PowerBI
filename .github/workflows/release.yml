# Creates a numbered version (v1.0.N) with release notes every time an approved
# pull request is merged into main, so every change to the model is versioned.
name: Version approved changes

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out next version
        id: version
        run: |
          last=$(git tag --list 'v1.0.*' --sort=-v:refname | head -n 1)
          if [ -z "$last" ]; then next="v1.0.0"; else next="v1.0.$(( ${last##*.} + 1 ))"; fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
